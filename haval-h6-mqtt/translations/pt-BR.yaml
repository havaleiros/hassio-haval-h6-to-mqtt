configuration:
  refresh_time:
    name: "Intervalo de Atualização (segundos)"
    description: "Tempo para consulta da API e atualização dos dados das entidades criadas por esta integração. Não pode ser menor que 5 segundos."
  gwm_username:
    name: "Nome de usuário do aplicativo 'My GWM'"
    description: "O endereço de e-mail utilizado no cadastro."
  gwm_password:
    name: "Senha do aplicativo 'My GWM'"
  gwm_vin:
    name: "Chassis do veículo principal"
    description: "Verifique no aplicativo ou na nota fiscal."
  gwm_pin:
    name: "PIN de segurança do aplicativo 'My GWM'"
    description: "Código PIN de segurança de 6 dígitos cadastrado no aplicativo 'My GWM' (Configurações do carro -> PIN). Necessário para envio de comandos remotos."
  gwm_verify_code:
    name: "Código de verificação por e-mail (OTP)"
    description: "Código recebido por e-mail na primeira autenticação de um novo dispositivo (erro 308103)."
  mqtt_server:
    name: "Endereço do servidor MQTT"
    description: "Endereço do servidor MQTT de sua instância do Home Assistant ou broker externo. Mantenha o padrão caso esteja instalado junto ao Home Assistant como um serviço."
  mqtt_user:
    name: "Nome de usuário do broker MQTT"
    description: "Usuário configurado no servidor MQTT de sua instância do Home Assistant ou broker externo."
  mqtt_pass:
    name: "Senha do broker MQTT"
    description: "Senha configurada no servidor MQTT de sua instância do Home Assistant ou broker externo."
  device_tracker_enabled:
    name: "Ativar o device tracker"
    description: "Registrará o posicionamento do veículo com rastreamento com base no intervalo configurado. Utilizado para exibição no mapa."
  log_level:
    name: "Nível de Log"
    description: "Define o nível de verbosidade dos logs da integração."
  ac_temperature:
    name: "Temperatura inicial do A/C (°C)"
    description: "Somente valor inicial (17–31). Após a inicialização, ajuste diretamente pelo slider 'Temperatura do A/C' no Home Assistant."
  ac_duration_minutes:
    name: "Duração inicial do A/C (minutos)"
    description: "Somente valor inicial (5–30). Após a inicialização, ajuste diretamente pelo slider 'Duração do A/C' no Home Assistant."
  purifier_duration_minutes:
    name: "Duração inicial do purificador (minutos)"
    description: "Somente valor inicial (5–30). Após a inicialização, ajuste diretamente pelo slider 'Duração do purificador' no Home Assistant."