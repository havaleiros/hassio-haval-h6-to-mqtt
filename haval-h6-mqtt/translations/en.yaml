configuration:
  refresh_time:
    name: "Refresh Interval (seconds)"
    description: "Time interval for querying the API and updating data for entities created by this integration. It cannot be lower than 5 seconds."
  gwm_username:
    name: "'My GWM' App Username"
    description: "The email address used during registration."
  gwm_password:
    name: "'My GWM' App Password"
  gwm_vin:
    name: "Default Vehicle Chassis"
    description: "Check in the app or on the invoice."
  gwm_pin:
    name: "'My GWM' Security PIN"
    description: "6-digit security PIN configured in the My GWM app (Vehicle Settings -> PIN). Required for remote commands."
  gwm_verify_code:
    name: "Email verification code (OTP)"
    description: "Verification code received by email when authenticating a new device (code 308103)."
  mqtt_server:
    name: "MQTT Server Address"
    description: "Address of your Home Assistant's MQTT server or external broker. Keep default if installed alongside Home Assistant as a service."
  mqtt_user:
    name: "MQTT Broker Username"
    description: "Username configured on your Home Assistant's MQTT server or external broker."
  mqtt_pass:
    name: "MQTT Broker Password"
    description: "Password configured on your Home Assistant's MQTT server or external broker."
  device_tracker_enabled:
    name: "Enable Device Tracker"
    description: "Registers vehicle positioning with tracking based on the configured interval. Used for display on the map."
  log_level:
    name: "Log Level"
    description: "Set the verbosity level of the integration's logs."
  ac_temperature:
    name: "Initial A/C Temperature (°C)"
    description: "Initial value only (17–31). After first start, use the \"Temperatura do A/C\" slider entity in Home Assistant."
  ac_duration_minutes:
    name: "Initial A/C Duration (minutes)"
    description: "Initial value only (5–30). After first start, use the \"Duração do A/C\" slider entity in Home Assistant."
  purifier_duration_minutes:
    name: "Initial Purifier Duration (minutes)"
    description: "Initial value only (5–30). After first start, use the \"Duração do purificador\" slider entity in Home Assistant."